[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Registration to Vobiz
[vobiz-reg]
type = registration
transport = transport-udp
outbound_auth = vobiz-auth
server_uri = sip:registrar.vobiz.ai
client_uri = sip:dailsmart9645796928677572109@registrar.vobiz.ai
retry_interval = 60
expiration = 3600

; Outbound authentication (used for both registrar and trunk)
[vobiz-auth]
type = auth
auth_type = userpass
username = dailsmart9645796928677572109
password = Reddy@7989

; AOR (Address of Record) for Vobiz registrar
[vobiz-aor]
type = aor
contact = sip:registrar.vobiz.ai

; Endpoint for Vobiz (inbound calls from registrar)
[vobiz-endpoint]
type = endpoint
transport = transport-udp
context = from-external
disallow = all
allow = ulaw,alaw
outbound_auth = vobiz-auth
aors = vobiz-aor
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
send_rpid = yes
send_pai = yes
from_user = 918065481144
from_domain = registrar.vobiz.ai

; Identify incoming calls from Vobiz registrar IP
[vobiz-identify]
type = identify
endpoint = vobiz-endpoint
match = registrar.vobiz.ai

; ---- Outbound SIP Trunk (pace college) ----
; Auth for trunk domain
[vobiz-trunk-auth]
type = auth
auth_type = userpass
username = dailsmart
password = Reddy@7989

; AOR for trunk domain
[vobiz-trunk-aor]
type = aor
contact = sip:455bdb01.sip.vobiz.ai

; Endpoint for outbound trunk calls
[vobiz-trunk]
type = endpoint
transport = transport-udp
context = from-external
disallow = all
allow = ulaw,alaw
outbound_auth = vobiz-trunk-auth
aors = vobiz-trunk-aor
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
send_rpid = yes
send_pai = yes
from_user = 918065481144
from_domain = 455bdb01.sip.vobiz.ai
